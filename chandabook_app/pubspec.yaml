name: chandabook_app
description: "ChandaBook - Utsav Festive Finance & Chanda Donation Management Android App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  confetti: ^0.7.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  app_links: ^6.3.2
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
