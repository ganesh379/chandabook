<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Meta Tags -->
    <title>ChandaBook | Universal Festival Donation & Daily Expense Ledger</title>
    <meta name="title" content="ChandaBook | Universal Festival Donation & Daily Expense Ledger" />
    <meta name="description" content="ChandaBook is a mobile-first Progressive Web App (PWA) for festival committees to manage Chanda (donation) collections, daily expenses, member leaderboards, digital WhatsApp receipts, and real-time cash balance tracking for Vinayaka Chavithi, Durga Puja, Diwali, Sankranti, and all community events." />
    <meta name="keywords" content="ChandaBook, Vinayaka Chavithi Chanda, Ganesh Chaturthi Donation App, Festival Ledger, Chanda Collection App, Festival Expenses Tracker, WhatsApp Donor Receipt Generator, Daily Utsav Balance, Committee Cash Tracker, Durga Puja Chanda, Diwali Utsav Ledger" />
    <meta name="author" content="ChandaBook Team" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA & Mobile Viewport -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChandaBook" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chandabook.app/" />
    <meta property="og:title" content="ChandaBook | Universal Festival Donation & Expense Manager" />
    <meta property="og:description" content="Track festival collections, daily expenses, member leaderboards, and instant WhatsApp receipts for Vinayaka Chavithi, Durga Puja, and all festival events." />

    <meta property="twitter:title" content="ChandaBook | Festival Chanda & Expense Ledger" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
