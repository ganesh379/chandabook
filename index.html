<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Meta Tags -->
    <title>ChandaBook | Universal Festival Donation & Daily Expense Ledger</title>
    <meta name="title" content="ChandaBook | Universal Festival Donation & Daily Expense Ledger" />
    <meta name="description" content="ChandaBook is a mobile-first Progressive Web App (PWA) for festival committees to manage Chanda (donation) collections, daily expenses, member leaderboards, digital WhatsApp receipts, and real-time cash balance tracking for Vinayaka Chavithi, Durga Puja, Diwali, Sankranti, and all community events." />
    <meta name="keywords" content="ChandaBook, Vinayaka Chavithi Chanda, Ganesh Chaturthi Donation App, Festival Ledger, Chanda Collection App, Festival Expenses Tracker, WhatsApp Donor Receipt Generator, Daily Utsav Balance, Committee Cash Tracker, Durga Puja Chanda, Diwali Utsav Ledger" />
    <meta name="author" content="ChandaBook Team" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA & Mobile Viewport -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChandaBook" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chandabook.app/" />
    <meta property="og:title" content="ChandaBook | Universal Festival Donation & Expense Manager" />
    <meta property="og:description" content="Track festival collections, daily expenses, member leaderboards, and instant WhatsApp receipts for Vinayaka Chavithi, Durga Puja, and all festival events." />
    <meta property="og:image" content="/og-banner.png" />

    <!-- Twitter SEO -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ChandaBook | Festival Chanda & Expense Ledger" />
    <meta property="twitter:description" content="Manage festival collections, track member leaderboards, and send digital WhatsApp receipts." />

    <!-- Favicon: SVG for modern browsers, PNG fallback for older Safari.
         The diya mark carries its own saffron disc so it stays legible on both
         light and dark tab strips. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!-- iOS home screen (required for web push on iPhone, which only works
         for apps installed to the Home Screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
